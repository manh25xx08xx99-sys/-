<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>現場写真マップ</title>

<!-- PWA / "Add to Home Screen" support -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Khảo sát ảnh">
<meta name="theme-color" content="#0B2545">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230B2545'/%3E%3Cpath d='M30 78 L30 40 L50 22 L70 40 L70 78 Z' fill='none' stroke='%23F5F3EC' stroke-width='4'/%3E%3Ccircle cx='50' cy='52' r='9' fill='%23FF6B35' stroke='%231A0B02' stroke-width='2'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230B2545'/%3E%3Cpath d='M30 78 L30 40 L50 22 L70 40 L70 78 Z' fill='none' stroke='%23F5F3EC' stroke-width='4'/%3E%3Ccircle cx='50' cy='52' r='9' fill='%23FF6B35' stroke='%231A0B02' stroke-width='2'/%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Kh%E1%BA%A3o%20s%C3%A1t%20%E1%BA%A3nh%20c%C3%B4ng%20tr%C3%ACnh","short_name":"Kh%E1%BA%A3o%20s%C3%A1t","start_url":".","display":"standalone","background_color":"%230B2545","theme_color":"%230B2545"}'>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --navy-deep:#0B2545;
    --navy-mid:#123363;
    --grid-line:rgba(140,180,230,0.18);
    --paper:#F5F3EC;
    --ink:#0B2545;
    --ink-soft:#5A6B87;
    --accent:#FF6B35;
    --accent-dim:#C9502099;
    --panel:#0E2C54;
    --panel-line:#274975;
    --ok:#3FA97E;
    --danger:#E6544A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'IBM Plex Sans',sans-serif;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/28px 28px,
      var(--navy-deep);
    color:var(--paper);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--panel-line);
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:40;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-right:auto;
  }
  .brand .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--accent);
    border:1px solid var(--accent-dim);
    padding:3px 7px;
    border-radius:4px;
  }
  .brand h1{
    font-size:16px;
    margin:0;
    font-weight:600;
    letter-spacing:.01em;
  }
  .brand h1 small{
    display:block;
    font-size:11px;
    font-weight:400;
    color:#9FB2CC;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.05em;
    margin-top:2px;
  }
  button{
    font-family:'IBM Plex Sans',sans-serif;
    cursor:pointer;
    border:none;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:transform .12s ease, filter .12s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent);color:#1A0B02;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;color:var(--paper);border:1px solid var(--panel-line);}
  .btn-ghost:hover{border-color:#5A80B8;}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}
  input[type=file]{display:none;}
  .pagebar{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:#C7D5EA;
  }
  .pagebar button{padding:6px 10px;background:var(--navy-mid);color:var(--paper);border:1px solid var(--panel-line);}
  .pagebar button:disabled{opacity:.35;cursor:not-allowed;}

  /* ---------- Layout ---------- */
  .layout{
    flex:1;
    display:flex;
    min-height:0;
  }
  .stage-wrap{
    flex:1;
    overflow:auto;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px;
  }
  .stage{
    position:relative;
    background:var(--paper);
    box-shadow:0 20px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
    border-radius:2px;
    cursor:crosshair;
    line-height:0;
  }
  .stage canvas{display:block;max-width:none;}
  .stage.empty{
    width:min(720px,86vw);
    height:min(520px,60vh);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:default;
    border:1.5px dashed var(--panel-line);
    background:transparent;
    box-shadow:none;
    border-radius:var(--radius);
  }
  .empty-msg{
    text-align:center;
    color:#8FA4C4;
    max-width:340px;
    padding:20px;
  }
  .empty-msg .glyph{
    font-size:34px;
    display:block;
    margin-bottom:10px;
    filter:grayscale(1) opacity(.7);
  }
  .empty-msg h2{font-size:15px;color:var(--paper);margin:0 0 8px;font-weight:600;}
  .empty-msg p{font-size:12.5px;line-height:1.55;margin:0;}

  .pin{
    position:absolute;
    transform:translate(-50%,-100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    z-index:10;
    user-select:none;
  }
  .pin .dot{
    width:26px;height:26px;
    border-radius:50% 50% 50% 0;
    background:var(--accent);
    border:2px solid #1A0B02;
    transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,.35);
    transition:transform .12s ease, filter .12s ease;
  }
  .pin .num{
    transform:rotate(45deg);
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:11px;
    color:#1A0B02;
  }
  .pin:hover .dot, .pin.active .dot{transform:rotate(-45deg) scale(1.15);filter:brightness(1.1);}
  .pin.active .dot{background:var(--ok);}
  .pin .photocount{
    position:absolute;
    top:-6px;
    right:-8px;
    background:var(--navy-deep);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    font-weight:700;
    border-radius:8px;
    padding:1px 5px;
    border:1px solid var(--panel-line);
  }

  .ghost-pin{
    position:absolute;
    width:26px;height:26px;
    border-radius:50% 50% 50% 0;
    border:2px dashed var(--accent);
    transform:translate(-50%,-100%) rotate(-45deg);
    pointer-events:none;
    z-index:9;
  }

  /* ---------- Sidebar ---------- */
  aside{
    width:320px;
    flex-shrink:0;
    background:var(--panel);
    border-left:1px solid var(--panel-line);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .aside-head{
    padding:14px 16px 10px;
    border-bottom:1px solid var(--panel-line);
  }
  .aside-head h3{
    margin:0 0 2px;
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .aside-head .count{
    font-family:'IBM Plex Mono',monospace;
    color:var(--accent);
    font-size:12px;
  }
  .aside-head p{margin:4px 0 0;font-size:11.5px;color:#8FA4C4;}
  .pin-list{
    flex:1;
    overflow-y:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .pin-card{
    background:var(--navy-mid);
    border:1px solid var(--panel-line);
    border-radius:var(--radius);
    padding:10px;
    display:flex;
    gap:10px;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .pin-card:hover{border-color:var(--accent-dim);}
  .pin-card.active{border-color:var(--accent);background:#173765;}
  .pin-card .thumb{
    width:52px;height:52px;
    border-radius:6px;
    background:#0A1F3C center/cover no-repeat;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:#5A80B8;
    border:1px solid var(--panel-line);
  }
  .pin-card .meta{min-width:0;flex:1;}
  .pin-card .meta .row1{
    display:flex;align-items:center;gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--accent);font-weight:700;
  }
  .pin-card .meta .label{
    font-size:13px;font-weight:600;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pin-card .meta .sub{font-size:11px;color:#8FA4C4;margin-top:2px;}
  .empty-list{
    padding:30px 16px;text-align:center;color:#6F86A8;font-size:12.5px;line-height:1.6;
  }
  .aside-foot{
    padding:12px 16px;
    border-top:1px solid var(--panel-line);
    display:flex;
    gap:8px;
  }
  .aside-foot button{flex:1;justify-content:center;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(4,12,26,.72);
    backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
    padding:20px;
  }
  .hidden{display:none !important;}
  .modal{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:14px;
    width:min(460px,100%);
    max-height:88vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,.5);
  }
  .modal-head{
    padding:16px 18px;
    border-bottom:1px solid var(--panel-line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal-head .title{display:flex;align-items:center;gap:8px;}
  .modal-head .badge{
    font-family:'IBM Plex Mono',monospace;
    background:var(--accent);color:#1A0B02;font-weight:700;
    font-size:11px;padding:3px 8px;border-radius:6px;
  }
  .modal-head h3{margin:0;font-size:14px;font-weight:600;}
  .icon-x{
    background:transparent;border:none;color:#8FA4C4;font-size:18px;padding:4px 8px;border-radius:6px;
  }
  .icon-x:hover{color:var(--paper);background:var(--navy-mid);}
  .modal-body{padding:16px 18px;overflow-y:auto;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:11.5px;font-weight:600;color:#9FB2CC;
    margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;
  }
  .field input[type=text]{
    width:100%;
    background:var(--navy-mid);
    border:1px solid var(--panel-line);
    color:var(--paper);
    border-radius:7px;
    padding:9px 11px;
    font-size:13.5px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .field input[type=text]:focus{outline:none;border-color:var(--accent);}
  .photo-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:8px;
  }
  .photo-tile{
    position:relative;
    aspect-ratio:1;
    border-radius:8px;
    overflow:hidden;
    border:1px solid var(--panel-line);
  }
  .photo-tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-tile .del{
    position:absolute;top:3px;right:3px;
    width:20px;height:20px;border-radius:50%;
    background:rgba(10,20,40,.75);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;border:none;padding:0;
  }
  .add-photo-tile{
    aspect-ratio:1;border-radius:8px;
    border:1.5px dashed var(--panel-line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;color:#8FA4C4;cursor:pointer;font-size:10.5px;text-align:center;
    background:transparent;
  }
  .add-photo-tile:hover{border-color:var(--accent);color:var(--paper);}
  .add-photo-tile .plus{font-size:20px;line-height:1;}
  .modal-foot{
    padding:14px 18px;
    border-top:1px solid var(--panel-line);
    display:flex;
    gap:10px;
  }
  .modal-foot .btn-danger{background:transparent;color:var(--danger);border:1px solid #E6544A55;}
  .modal-foot .btn-danger:hover{background:#E6544A18;}
  .modal-foot .spacer{flex:1;}

  /* lightbox */
  .lightbox{
    position:fixed;inset:0;z-index:200;background:rgba(4,10,22,.92);
    display:flex;align-items:center;justify-content:center;padding:30px;
  }
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .lightbox .close{position:absolute;top:18px;right:22px;font-size:26px;background:none;border:none;color:#fff;}

  /* toast */
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--navy-mid);border:1px solid var(--panel-line);
    color:var(--paper);padding:10px 18px;border-radius:30px;
    font-size:12.5px;font-family:'IBM Plex Mono',monospace;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    z-index:300;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  @media(max-width:860px){
    .layout{flex-direction:column;}
    aside{width:100%;border-left:none;border-top:1px solid var(--panel-line);max-height:38vh;}
    .stage-wrap{padding:14px;}
  }

  /* Print report */
  @media print{
    body{background:#fff;color:#000;}
    header, aside, .stage.empty{display:none !important;}
    .layout{display:block;}
    .stage-wrap{padding:0;display:block;}
    .stage{box-shadow:none;}
    .report-only{display:block !important;}
  }
  .report-only{display:none;}
  .report-photo-block{
    margin-top:22px;
    page-break-inside:avoid;
  }
  .report-photo-block h4{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:#000;
    border-bottom:1px solid #ccc;
    padding-bottom:4px;
  }
  .report-photo-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;
  }
  .report-photo-grid img{width:100%;border-radius:4px;border:1px solid #ccc;}

  /* ---------- Continuous camera modal ---------- */
  .camera-wrap{
    position:fixed;inset:0;background:#000;
    display:flex;flex-direction:column;
    z-index:250;
  }
  .camera-wrap video{
    flex:1;width:100%;height:100%;object-fit:cover;background:#000;
  }
  .camera-topbar{
    position:absolute;top:0;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 14px calc(14px + env(safe-area-inset-top,0px));
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:linear-gradient(rgba(0,0,0,.55), transparent);
    z-index:2;
  }
  .camera-topbar .camera-close{background:rgba(20,20,20,.55);color:#fff;font-size:16px;}
  .camera-hint{color:#E8EDF5;font-size:11px;opacity:.85;text-align:center;flex:1;}
  .camera-count{
    background:var(--accent);color:#1A0B02;font-weight:700;
    border-radius:14px;padding:3px 10px;font-size:12px;
  }
  .camera-filmstrip{
    position:absolute;
    bottom:118px;left:0;right:0;
    display:flex;gap:8px;padding:0 14px;
    overflow-x:auto;
    z-index:2;
  }
  .camera-filmstrip img{
    width:52px;height:52px;object-fit:cover;border-radius:8px;
    border:2px solid rgba(255,255,255,.7);flex-shrink:0;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
  }
  .camera-controls{
    position:absolute;bottom:0;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(transparent, rgba(0,0,0,.6));
    z-index:2;
  }
  .camera-shutter{
    width:70px;height:70px;border-radius:50%;
    background:#fff;border:4px solid rgba(255,255,255,.4);
    padding:0;
  }
  .camera-shutter:active{background:#ddd;}
  .camera-done{padding:9px 20px;}
  .flash{
    position:absolute;inset:0;background:#fff;opacity:0;
    pointer-events:none;z-index:5;
  }
  .flash.go{animation:flashpop .25s ease;}
  @keyframes flashpop{0%{opacity:.85;}100%{opacity:0;}}

  /* ---------- Lock screen ---------- */
  .lock-overlay{
    position:fixed;inset:0;z-index:500;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/28px 28px,
      var(--navy-deep);
  }
  .lock-card{
    width:min(340px,100%);
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:16px;
    padding:30px 26px 26px;
    text-align:center;
    box-shadow:0 30px 60px rgba(0,0,0,.5);
  }
  .lock-icon{font-size:32px;margin-bottom:10px;}
  .lock-card h2{margin:0 0 6px;font-size:16px;font-weight:600;}
  .lock-card p{margin:0 0 18px;font-size:12.5px;color:#9FB2CC;}
  .lock-card input[type=password]{
    width:100%;
    background:var(--navy-mid);
    border:1px solid var(--panel-line);
    color:var(--paper);
    border-radius:8px;
    padding:12px 14px;
    font-size:16px;
    text-align:center;
    letter-spacing:.1em;
    font-family:'IBM Plex Mono',monospace;
    margin-bottom:12px;
  }
  .lock-card input[type=password]:focus{outline:none;border-color:var(--accent);}
  .lock-card button{width:100%;justify-content:center;margin-top:2px;}
  .lock-error{
    color:var(--danger);
    font-size:12px;
    margin:12px 0 0;
    font-family:'IBM Plex Mono',monospace;
  }
</style>
</head>
<body>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h2 id="lockTitleText">アクセス制限</h2>
    <p id="lockDescText">パスワードを入力してください</p>
    <input type="password" id="lockPasswordInput" inputmode="text" autocomplete="off" placeholder="••••••••">
    <button class="btn-primary" id="lockSubmitBtn">確認</button>
    <p class="lock-error hidden" id="lockErrorText">パスワードが正しくありません</p>
  </div>
</div>

<header>
  <div class="brand">
    <span class="tag" id="tagLabel">現地調査</span>
    <h1><span id="titleText">現場写真マップ</span><small id="subtitleText">PDF図面 · 位置ピン · 写真添付</small></h1>
  </div>

  <div class="pagebar" id="pagebar" style="display:none;">
    <button id="prevPage">‹</button>
    <span id="pageLabel" class="mono">1 / 1</span>
    <button id="nextPage">›</button>
  </div>

  <button class="btn-ghost btn-sm" id="langToggle">🌐 VI</button>
  <input type="file" id="pdfInput" accept="application/pdf">
  <button class="btn-ghost" id="loadPdfBtn">📄 図面PDFを読み込む</button>
  <button class="btn-primary" id="printBtn" style="display:none;">🖨️ レポート出力</button>
</header>

<div class="layout">
  <div class="stage-wrap">
    <div id="stage" class="stage empty">
      <div class="empty-msg">
        <span class="glyph">🗺️</span>
        <h2 id="emptyTitleText">図面が読み込まれていません</h2>
        <p id="emptyDescText">現場の図面PDFをアップロードしてください。その後、図面上の任意の位置をタップするとピンを立て、その場所の写真を添付できます。</p>
      </div>
    </div>
  </div>

  <aside>
    <div class="aside-head">
      <h3><span id="pinListTitleText">ピン一覧</span> <span class="count mono" id="pinCount">0</span></h3>
      <p id="pinListDescText">図面をタップして新しいピンを追加</p>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ---------- Password lock ----------
// Change PASSWORD_HASH below to update the password — anyone who unlocked
// with the OLD hash will automatically be asked again, since the app
// compares against this new value on every load.
const PASSWORD_HASH = '9e969b4632bfd5f5e866c4806864a0f6c5baddfa0f52cdce4f33bef930720ef7'; // asahi0309
const AUTH_STORAGE_KEY = 'khaosat_authhash_v1';

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

const lockOverlay = document.getElementById('lockOverlay');
const lockPasswordInput = document.getElementById('lockPasswordInput');
const lockSubmitBtn = document.getElementById('lockSubmitBtn');
const lockErrorText = document.getElementById('lockErrorText');

function unlockApp(){
  lockOverlay.classList.add('hidden');
}

async function attemptUnlock(){
  const pw = lockPasswordInput.value;
  const hash = await sha256Hex(pw);
  if(hash === PASSWORD_HASH){
    localStorage.setItem(AUTH_STORAGE_KEY, PASSWORD_HASH);
    lockErrorText.classList.add('hidden');
    lockPasswordInput.value = '';
    unlockApp();
  }else{
    lockErrorText.classList.remove('hidden');
    lockPasswordInput.value = '';
    lockPasswordInput.focus();
  }
}

lockSubmitBtn.addEventListener('click', attemptUnlock);
lockPasswordInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') attemptUnlock(); });

// If this device already unlocked with the CURRENT password before, skip the prompt.
if(localStorage.getItem(AUTH_STORAGE_KEY) === PASSWORD_HASH){
  unlockApp();
}else{
  setTimeout(()=>lockPasswordInput.focus(), 200);
}

// ---------- i18n ----------
const I18N = {

    pinListTitle:'Danh sách vị trí', pinListDesc:'Chạm vào bản vẽ để thêm ghim mới',

let currentLang = 'ja';
function t(key){ return I18N[currentLang][key]; }

function applyLanguage(){
  document.documentElement.lang = currentLang;
  document.getElementById('tagLabel').textContent = t('tag');
  document.getElementById('titleText').textContent = t('title');
  document.getElementById('subtitleText').textContent = t('subtitle');

  document.getElementById('pinListDescText').textContent = t('pinListDesc');

  document.getElementById('importJsonBtn').textContent = t('loadJson');

  document.getElementById('labelNoteText').textContent = t('labelNote');
  document.getElementById('pinLabel').placeholder = t('placeholderNote');

document.getElementById('langToggle').addEventListener('click', ()=>{
  currentLang = currentLang === 'ja' ? 'vi' : 'ja';
  applyLanguage();
});

// ---------- State ----------
let pdfDoc = null;
let currentPage = 1;
let totalPages = 1;
let pins = [];          // {id, page, xPct, yPct, label, photos:[{id,dataUrl}]}
let activePinId = null;
let pendingClick = null; // {xPct,yPct} while creating a new pin
let nextPinNumber = 1;

const stage = document.getElementById('stage');
const pagebar = document.getElementById('pagebar');
const pageLabel = document.getElementById('pageLabel');
const pinList = document.getElementById('pinList');
const pinCount = document.getElementById('pinCount');
const toast = document.getElementById('toast');

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove('show'), 2200);
}

// ---------- PDF loading ----------
document.getElementById('loadPdfBtn').addEventListener('click', ()=>document.getElementById('pdfInput').click());
document.getElementById('pdfInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const buf = await file.arrayBuffer();
  pdfDoc = await pdfjsLib.getDocument({data: buf}).promise;
  totalPages = pdfDoc.numPages;
  currentPage = 1;
  pagebar.style.display = totalPages > 1 ? 'flex' : 'none';
  document.getElementById('printBtn').style.display = 'inline-flex';
  await renderPage();
  showToast(t('toastPdfLoaded')(file.name));
});

document.getElementById('prevPage').addEventListener('click', ()=>{ if(currentPage>1){currentPage--; renderPage();} });
document.getElementById('nextPage').addEventListener('click', ()=>{ if(currentPage<totalPages){currentPage++; renderPage();} });

async function renderPage(){
  stage.classList.remove('empty');
  stage.innerHTML = '';
  const page = await pdfDoc.getPage(currentPage);
  const containerWidth = Math.min(document.querySelector('.stage-wrap').clientWidth - 56, 1100);
  const baseViewport = page.getViewport({scale:1});
  const scale = containerWidth / baseViewport.width;
  const viewport = page.getViewport({scale: Math.max(scale, 0.4)});

  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  stage.appendChild(canvas);
  stage.style.width = viewport.width + 'px';
  stage.style.height = viewport.height + 'px';

  const ctx = canvas.getContext('2d');
  await page.render({canvasContext: ctx, viewport}).promise;

  pageLabel.textContent = currentPage + ' / ' + totalPages;

  stage.addEventListener('click', onStageClick);
  redrawPins();
}

function onStageClick(e){
  const rect = stage.getBoundingClientRect();
  const xPct = ((e.clientX - rect.left) / rect.width) * 100;
  const yPct = ((e.clientY - rect.top) / rect.height) * 100;
  pendingClick = {xPct, yPct};
  openPinModal(null);
}

// ---------- Pin rendering ----------
function redrawPins(){
  stage.querySelectorAll('.pin').forEach(p=>p.remove());
  pins.filter(p=>p.page===currentPage).forEach(p=>{
    const el = document.createElement('div');
    el.className = 'pin' + (p.id===activePinId ? ' active' : '');
    el.style.left = p.xPct + '%';
    el.style.top = p.yPct + '%';
    el.innerHTML = `<div class="dot"><span class="num">${p.number}</span></div>` +
      (p.photos.length ? `<div class="photocount">${p.photos.length}</div>` : '');
    el.addEventListener('click', (ev)=>{ ev.stopPropagation(); openPinModal(p.id); });
    stage.appendChild(el);
  });
  renderPinList();
}

function renderPinList(){
  const pagePins = pins.filter(p=>p.page===currentPage);
  pinCount.textContent = pins.length;
  if(pagePins.length === 0){
    pinList.innerHTML = `<div class="empty-list">${t('pinListEmpty')}</div>`;
    return;
  }
  pinList.innerHTML = '';
  pagePins.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'pin-card' + (p.id===activePinId ? ' active' : '');
    const thumbStyle = p.photos.length ? `background-image:url('${p.photos[0].dataUrl}')` : '';
    card.innerHTML = `
      <div class="thumb" style="${thumbStyle}">${p.photos.length ? '' : t('noPhoto')}</div>
      <div class="meta">
        <div class="row1">${t('pinLabelPrefix')}${p.number}</div>
        <div class="label">${p.label ? escapeHtml(p.label) : t('noName')}</div>
        <div class="sub">${p.photos.length} ${t('photosSuffix')}</div>
      </div>`;
    card.addEventListener('click', ()=>openPinModal(p.id));
    pinList.appendChild(card);
  });
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

// ---------- Modal ----------
const pinModal = document.getElementById('pinModal');
const modalPinNum = document.getElementById('modalPinNum');
const pinLabelInput = document.getElementById('pinLabel');
const photoGrid = document.getElementById('photoGrid');
const photoCountLabel = document.getElementById('photoCountLabel');
const photoInput = document.getElementById('photoInput');

let editingPinId = null;

function openPinModal(pinId){
  if(pinId === null){
    // creating new pin
    const p = {
      id: 'pin_' + Date.now(),
      number: nextPinNumber++,
      page: currentPage,
      xPct: pendingClick.xPct,
      yPct: pendingClick.yPct,
      label: '',
      photos: []
    };
    pins.push(p);
    editingPinId = p.id;
  } else {
    editingPinId = pinId;
  }
  activePinId = editingPinId;
  const pin = pins.find(p=>p.id===editingPinId);
  modalPinNum.textContent = '#' + pin.number;
  pinLabelInput.value = pin.label;
  renderPhotoGrid();
  pinModal.classList.remove('hidden');
  redrawPins();
}

function currentEditingPin(){ return pins.find(p=>p.id===editingPinId); }

function renderPhotoGrid(){
  const pin = currentEditingPin();
  photoCountLabel.textContent = pin.photos.length ? `(${pin.photos.length})` : '';
  photoGrid.innerHTML = '';
  pin.photos.forEach(ph=>{
    const tile = document.createElement('div');
    tile.className = 'photo-tile';
    tile.innerHTML = `<img src="${ph.dataUrl}"><button class="del" data-pid="${ph.id}">✕</button>`;
    tile.querySelector('img').addEventListener('click', ()=>openLightbox(ph.dataUrl));
    tile.querySelector('.del').addEventListener('click', (e)=>{
      e.stopPropagation();
      pin.photos = pin.photos.filter(x=>x.id !== ph.id);
      renderPhotoGrid();
      redrawPins();
    });
    photoGrid.appendChild(tile);
  });
  const camTile = document.createElement('button');
  camTile.className = 'add-photo-tile';
  camTile.innerHTML = `<span class="plus">＋</span><span>${t('addPhoto')}</span>`;
  camTile.addEventListener('click', openCamera);
  photoGrid.appendChild(camTile);

  const uploadTile = document.createElement('button');
  uploadTile.className = 'add-photo-tile';
  uploadTile.innerHTML = `<span class="plus">🖼️</span><span>${t('addPhotoUpload')}</span>`;
  uploadTile.addEventListener('click', ()=>photoInput.click());
  photoGrid.appendChild(uploadTile);
}

photoInput.addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files);
  const pin = currentEditingPin();
  for(const file of files){
    const dataUrl = await fileToDataUrl(file);
    pin.photos.push({id:'ph_'+Date.now()+Math.random().toString(36).slice(2,6), dataUrl});
  }
  photoInput.value = '';
  renderPhotoGrid();
  redrawPins();
});

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

document.getElementById('closeModal').addEventListener('click', closeModal);
document.getElementById('doneBtn').addEventListener('click', closeModal);

// ---------- Continuous camera capture ----------
const cameraModal = document.getElementById('cameraModal');
const cameraVideo = document.getElementById('cameraVideo');
const cameraCanvas = document.getElementById('cameraCanvas');
const cameraShotCount = document.getElementById('cameraShotCount');
const cameraFilmstrip = document.getElementById('cameraFilmstrip');
let cameraStream = null;
let shotsThisSession = 0;

async function openCamera(){
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: {ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} },
      audio: false
    });
    cameraVideo.srcObject = cameraStream;
    shotsThisSession = 0;
    cameraShotCount.textContent = '0';
    cameraFilmstrip.innerHTML = '';
    cameraModal.classList.remove('hidden');
  }catch(err){
    showToast(t('toastCameraError'));
    photoInput.click(); // fallback to native picker (lets user pick camera or library)
  }
}

function closeCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
    cameraStream = null;
  }
  cameraModal.classList.add('hidden');
  renderPhotoGrid();
  redrawPins();
}

document.getElementById('cameraClose').addEventListener('click', closeCamera);
document.getElementById('cameraDoneBtn').addEventListener('click', closeCamera);

document.getElementById('cameraShutterBtn').addEventListener('click', ()=>{
  const pin = currentEditingPin();
  if(!pin || !cameraVideo.videoWidth) return;
  cameraCanvas.width = cameraVideo.videoWidth;
  cameraCanvas.height = cameraVideo.videoHeight;
  const ctx = cameraCanvas.getContext('2d');
  ctx.drawImage(cameraVideo, 0, 0, cameraCanvas.width, cameraCanvas.height);
  const dataUrl = cameraCanvas.toDataURL('image/jpeg', 0.86);
  pin.photos.push({id:'ph_'+Date.now()+Math.random().toString(36).slice(2,6), dataUrl});

  shotsThisSession++;
  cameraShotCount.textContent = shotsThisSession;
  const thumb = document.createElement('img');
  thumb.src = dataUrl;
  cameraFilmstrip.appendChild(thumb);
  cameraFilmstrip.scrollLeft = cameraFilmstrip.scrollWidth;

  // flash effect
  const flash = document.createElement('div');
  flash.className = 'flash go';
  document.querySelector('.camera-wrap').appendChild(flash);
  setTimeout(()=>flash.remove(), 260);
});

function closeModal(){
  const pin = currentEditingPin();
  if(pin){
    pin.label = pinLabelInput.value.trim();
    if(pin.photos.length === 0 && pin.label === ''){
      // discard empty pin created without any content
      pins = pins.filter(p=>p.id !== pin.id);
    }
  }
  pinModal.classList.add('hidden');
  activePinId = null;
  redrawPins();
}

document.getElementById('deletePinBtn').addEventListener('click', ()=>{
  pins = pins.filter(p=>p.id !== editingPinId);
  pinModal.classList.add('hidden');
  activePinId = null;
  redrawPins();
  showToast(t('toastPinDeleted'));
});

pinModal.addEventListener('click', (e)=>{ if(e.target === pinModal) closeModal(); });

// ---------- Lightbox ----------
const lightbox = document.getElementById('lightbox');
function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  lightbox.classList.remove('hidden');
}
document.getElementById('lightboxClose').addEventListener('click', ()=>lightbox.classList.add('hidden'));
lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) lightbox.classList.add('hidden'); });

// ---------- Export / Import JSON ----------
document.getElementById('exportJsonBtn').addEventListener('click', ()=>{
  if(pins.length === 0){ showToast(t('toastNoData')); return; }
  const data = JSON.stringify({pins, savedAt: new Date().toISOString()});
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'khao-sat-anh-' + Date.now() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast(t('toastSaved'));
});

document.getElementById('importJsonBtn').addEventListener('click', ()=>document.getElementById('importJsonInput').click());
document.getElementById('importJsonInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const text = await file.text();
  try{
    const data = JSON.parse(text);
    pins = data.pins || [];
    nextPinNumber = pins.reduce((m,p)=>Math.max(m, p.number+1), 1);
    redrawPins();
    showToast(t('toastLoaded')(pins.length));
  }catch(err){
    showToast(t('toastInvalid'));
  }
});

// ---------- Print report ----------
document.getElementById('printBtn').addEventListener('click', ()=>{
  if(pins.length === 0){ showToast(t('toastNoPinForReport')); window.print(); return; }
  const root = document.getElementById('reportRoot');
  root.innerHTML = '';
  const pagesUsed = [...new Set(pins.map(p=>p.page))].sort((a,b)=>a-b);
  pagesUsed.forEach(pageNum=>{
    const pagePins = pins.filter(p=>p.page===pageNum);
    pagePins.forEach(p=>{
      const block = document.createElement('div');
      block.className = 'report-photo-block';
      block.innerHTML = `<h4>${t('reportPage')(pageNum)} — ${t('pinLabelPrefix')}${p.number} ${p.label ? '— ' + escapeHtml(p.label) : ''}</h4>
        <div class="report-photo-grid">${p.photos.map(ph=>`<img src="${ph.dataUrl}">`).join('') || `<p style="color:#888;font-size:12px;">${t('reportNoPhoto')}</p>`}</div>`;
      root.appendChild(block);
    });
  });
  window.print();
});

window.addEventListener('resize', ()=>{ if(pdfDoc) renderPage(); });

applyLanguage();

// ---------- Offline support (Service Worker) ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').then(()=>{
      console.log('Service worker registered — app can now work offline.');
    }).catch(err=>console.warn('Service worker registration failed:', err));
  });
}
</script>
</body>
</html>
